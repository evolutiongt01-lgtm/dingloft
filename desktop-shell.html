<script type="module" id="dingloft-desktop-admin-auth">
// Determines Admin visibility in the desktop navbar using the same authority
// account.html and auth-global.js already use: a signed-in Firebase user whose
// session the Worker's /admin/session endpoint accepts (owners, historical admins,
// and active support staff from Firestore). No email list is hardcoded here.
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAKxQdUM49cVbBaXWJ5DF3s7EaNKlJRGhA",
  authDomain: "login-dingloft.firebaseapp.com",
  projectId: "login-dingloft",
  storageBucket: "login-dingloft.firebasestorage.app",
  messagingSenderId: "549466738202",
  appId: "1:549466738202:web:8bf305fe2c753e9d76cba3",
  measurementId: "G-R9SGZCDN13"
};
const fb = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(fb);
const WORKER = String(window.DINGLOFT_WORKER_BASE || "https://autumn-breeze-dfa0.evolutiongt01.workers.dev").replace(/\/$/, "");
onAuthStateChanged(auth, async (user) => {
  let isAdmin = false;
  if (user) {
    try {
      const token = await user.getIdToken(false);
      const response = await fetch(`${WORKER}/admin/session`, { headers: { Authorization: `Bearer ${token}` }, cache: "no-store" });
      isAdmin = response.ok;
    } catch (_) { isAdmin = false; }
  }
  window.dispatchEvent(new CustomEvent('dingloft:admin-state-local', { detail: { isAdmin } }));
});
</script>
