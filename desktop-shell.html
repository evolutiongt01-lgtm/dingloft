ckground:rgba(112,211,255,.09);border-color:rgba(112,211,255,.25);color:#c9f2ff;box-shadow:inset 0 -2px rgba(91,215,255,.58)}.action.primary{background:#f2f5f7;color:#070a0d;border-color:#f2f5f7;padding:0 19px}.action.primary:hover{background:#fff;color:#050709}.action svg{width:16px;height:16px}.stage{position:fixed;z-index:1;left:0;right:0;top:110px;bottom:0;overflow:hidden;background:#05070a}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#05070a;opacity:0;transform:translateY(5px);transition:opacity .17s ease,transform .22s cubic-bezier(.16,1,.3,1)}.frame.active{opacity:1;transform:none}.frame.out{opacity:0;transform:translateY(-4px);pointer-events:none}.progress{position:fixed;z-index:520;top:108px;left:50%;transform:translateX(-50%);width:min(1280px,calc(100% - 72px));height:2px;border-radius:4px;overflow:hidden;opacity:0;transition:.15s}.progress.show{opacity:1}.progress:before{content:"";position:absolute;inset:0;width:28%;background:linear-gradient(90deg,#72dcff,#7b8cff);animation:load .7s ease-in-out infinite}@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(460%)}}@media(max-width:899px),(pointer:coarse){body{overflow:auto}.shell-nav,.progress{display:none}.stage{position:static;height:100vh}}

<style id="dingloft-desktop-load-glow-v37">
@media (min-width:900px) and (pointer:fine){
  /* v37: replace the old blue loading bar with a glow emitted by the floating nav. */
  .progress{display:none!important;}
  .shell-nav{
    --load-x:82%;
    isolation:isolate!important;
    overflow:visible!important;
    transition:border-color .28s ease,box-shadow .34s ease,filter .34s ease!important;
  }
  .shell-nav::before,
  .shell-nav::after{
    content:"";position:absolute;pointer-events:none;opacity:0;z-index:-1;
    transform-origin:var(--load-x) 50%;will-change:transform,opacity,filter;
  }
  /* Wide ambient bloom that appears to escape from the navbar. */
  .shell-nav::before{
    left:-32px;right:-32px;top:-24px;bottom:-44px;border-radius:42px;
    background:
      radial-gradient(ellipse 280px 88px at var(--load-x) 54%,rgba(101,226,255,.46) 0%,rgba(83,176,255,.22) 34%,rgba(105,91,255,.13) 52%,transparent 74%),
      radial-gradient(ellipse 62% 80% at var(--load-x) 38%,rgba(112,220,255,.12),transparent 70%);
    filter:blur(18px) saturate(145%);
  }
  /* Sharper flash at the nav surface; no progress line/bar. */
  .shell-nav::after{
    inset:-2px;border-radius:24px;z-index:0;
    background:
      radial-gradient(ellipse 190px 50px at var(--load-x) 50%,rgba(209,250,255,.30) 0%,rgba(116,224,255,.16) 36%,transparent 72%);
    mix-blend-mode:screen;filter:blur(1px);
  }
  .shell-nav.loading{
    border-color:rgba(116,224,255,.27)!important;
    box-shadow:0 22px 64px rgba(0,0,0,.44),0 0 34px rgba(70,188,255,.08),inset 0 1px 0 rgba(255,255,255,.07)!important;
  }
  .shell-nav.loading::before{animation:dingloftNavAura 1.08s cubic-bezier(.16,1,.3,1) infinite;}
  .shell-nav.loading::after{animation:dingloftNavFlash .92s cubic-bezier(.16,1,.3,1) infinite;}
  .shell-nav.load-complete::before{animation:dingloftNavComplete .46s cubic-bezier(.16,1,.3,1) both;}
  .shell-nav.load-complete::after{animation:dingloftNavSurfaceComplete .38s cubic-bezier(.16,1,.3,1) both;}
  @keyframes dingloftNavAura{
    0%{opacity:.05;transform:scaleX(.18) scaleY(.72);filter:blur(22px) saturate(125%)}
    24%{opacity:.82;transform:scaleX(.74) scaleY(1);filter:blur(17px) saturate(155%)}
    72%{opacity:.34;transform:scaleX(1.18) scaleY(1.10);filter:blur(22px) saturate(145%)}
    100%{opacity:.08;transform:scaleX(1.42) scaleY(1.18);filter:blur(27px) saturate(130%)}
  }
  @keyframes dingloftNavFlash{
    0%{opacity:0;transform:scaleX(.12)}
    22%{opacity:.82;transform:scaleX(.52)}
    58%{opacity:.20;transform:scaleX(1.10)}
    100%{opacity:0;transform:scaleX(1.48)}
  }
  @keyframes dingloftNavComplete{
    0%{opacity:.54;transform:scaleX(.55) scaleY(.92);filter:blur(16px)}
    48%{opacity:.78;transform:scaleX(1.06) scaleY(1.04);filter:blur(19px)}
    100%{opacity:0;transform:scaleX(1.38) scaleY(1.14);filter:blur(25px)}
  }
  @keyframes dingloftNavSurfaceComplete{
    0%{opacity:.46;transform:scaleX(.38)}
    55%{opacity:.72;transform:scaleX(.94)}
    100%{opacity:0;transform:scaleX(1.30)}
  }
}
@media (prefers-reduced-motion:reduce){
  .shell-nav.loading::before,.shell-nav.loading::after,.shell-nav.load-complete::before,.shell-nav.load-complete::after{animation:none!important;opacity:0!important}
}
</style>
