  <style>
    :root {
      --bg-color: #05070a;
      --accent-color: #00e5ff;
      --accent-hover: #00b5cc;
      --text-main: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(17, 21, 31, 0.4);
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body.no-scroll { overflow: hidden !important; height: 100vh; }

    /* ====== EFECTO PUSH MENU ULTRA FLUIDO ====== */
    .page-wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
      z-index: 1;
    }

    .side-menu-drawer {
      position: fixed;
      top: 0;
      left: -280px; 
      width: 280px;
      height: 100vh;
      background: linear-gradient(145deg, rgba(10, 14, 20, 0.98), rgba(5, 7, 10, 1));
      border-right: 1px solid var(--border-color);
      z-index: 1040;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }

    .side-menu-drawer.active, 
    .page-wrapper.menu-pushed, 
    .navbar-glass.menu-pushed {
      transform: translateX(280px);
    }

    .side-menu-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1035;
      opacity: 0; visibility: hidden; transition: opacity 0.4s; cursor: pointer;
    }
    .side-menu-overlay.active { opacity: 1; visibility: visible; }

    .side-menu-link {
      color: rgba(255,255,255,0.85); font-size: 1.1rem; font-weight: 600; text-decoration: none;
      display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-radius: 12px; transition: all 0.2s;
    }
    .side-menu-link:hover { background: rgba(0, 229, 255, 0.1); color: var(--accent-color); }
    .side-menu-link i { font-size: 1.3rem; }

    /* ====== BUSCADOR LIQUID GLASS A PANTALLA COMPLETA ====== */
    .search-overlay-fullscreen {
      position: fixed; inset: 0; background: rgba(5, 7, 10, 0.95);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.4s ease;
      display: flex; flex-direction: column; padding: 50px 20px 20px;
    }
    .search-overlay-fullscreen.active { opacity: 1; visibility: visible; }
    
    .search-modal-box { width: min(600px, 100%); margin: 0 auto; transform
