<!doctype html>
<html lang="es"><head>
<!-- DINGLOFT_MOBILE_SHELL_BRIDGE -->
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const embedded=q.get('embed')==='1'||window.self!==window.top;
  if(embedded){document.documentElement.classList.add('dingloft-shell-view');return;}
  if(window.matchMedia('(max-width: 767px)').matches){
    let target=new URLSearchParams(location.search).get('mode')==='multitrack'?'app.html?route=multitrack':'app.html?route=catalog';
    location.replace(target);
  }
})();
</script>
<style>
@media(max-width:767px){
  html.dingloft-shell-view body{padding-bottom:110px!important;overscroll-behavior-y:contain!important}
  html.dingloft-shell-view .navbar-glass,
  html.dingloft-shell-view .mobile-app-dock,
  html.dingloft-shell-view .btn-floating-cart,
  html.dingloft-shell-view body>header{display:none!important}
  html.dingloft-shell-view .hero-section{padding-top:26px!important}
  html.dingloft-shell-view main{padding-top:24px!important}
}
</style>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dingloft · Tienda</title><link rel="icon" href="img/dingloft.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--bg:#05070a;--panel:#0b1016;--line:#1d2833;--text:#f4f8fb;--muted:#8d9baa;--cyan:#13d9f5;--green:#30db8d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(19,217,245,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:20;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px);border-bottom:1px solid var(--line);background:rgba(5,7,10,.83);backdrop-filter:blur(18px)}.brand{font-size:1.35rem;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--cyan)}.links{display:flex;gap:18px;color:#a5b0bc;font-size:.85rem}main{max-width:1250px;margin:auto;padding:58px 20px 90px}.eyebrow{font-size:.68rem;color:var(--cyan);font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(2.8rem,8vw,6rem);letter-spacing:-.065em;line-height:.9;margin:12px 0 18px;max-width:900px}.lead{color:var(--muted);max-width:720px;line-height:1.7}.bar{margin:34px 0 22px;display:grid;grid-template-columns:1fr 220px;gap:12px}input,select{width:100%;background:#080d12;border:1px solid var(--line);color:#fff;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{position:relative;min-height:330px;border:1px solid var(--line);background:linear-gradient(145deg,#0d141c,#090d12);border-radius:20px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);border-color:rgba(19,217,245,.35)}.visual{height:175px;display:grid;place-items:center;background:radial-gradient(circle,rgba(19,217,245,.11),transparent 63%);border-bottom:1px solid rgba(255,255,255,.06)}.visual img{max-width:120px;max-height:120px;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.34))}.copy{padding:18px}.meta{font-size:.65rem;color:#718396;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.title{font-size:1.08rem;font-weight:820;margin:7px 0 7px}.desc{font-size:.76rem;color:#8d9baa;line-height:1.55;height:36px;overflow:hidden}.bottom{display:flex;justify-content:space-between;align-items:end;margin-top:16px}.price{font-size:1.45rem;font-weight:900}.old{font-size:.75rem;color:#687582;text-decoration:line-through;margin-left:6px}.go{width:38px;height:38px;border-radius:11px;background:var(--cyan);color:#021116;display:grid;place-items:center;font-weight:900}.badge{position:absolute;top:12px;left:12px;background:#eefcff;color:#061218;padding:5px 8px;border-radius:999px;font-size:.62rem;font-weight:850}.blocked{position:absolute;top:12px;right:12px;background:#2a2110;color:#ffd36b;border:1px solid #57431c;padding:5px 8px;border-radius:999px;font-size:.61rem;font-weight:800}.empty{grid-column:1/-1;padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.links a:first-child{display:none}main{padding-top:36px}.bar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:3.7rem}}
</style></head><body>
<header><a class="brand" href="index.html"><span>D</span>ingloft</a><div class="links"><a href="index.html">Inicio</a><a href="account.html">Mi cuenta</a></div></header>
<main><div class="eyebrow">Catálogo conectado al Admin</div><h1>Todo Dingloft.<br>Una sola tienda.</h1><p class="lead">Los productos, precios y disponibilidad de esta página salen directamente del Worker. Lo que cambies en Administración aparece aquí sin crear otro HTML.</p>
<div class="bar"><input id="q" placeholder="Buscar software, librerías o multitracks…"><select id="category"><option value="">Todas las categorías</option></select></div><div class="grid" id="grid"><div class="empty">Cargando catálogo…</div></div></main>
<script>
const WORKER="https://autumn-breeze-dfa0.evolutiongt01.workers.dev";let products=[];const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imageOf(p){const raw=String(p.imageUrl||p.img||'dingloft');if(/^https?:\/\//i.test(raw)||raw.startsWith('img/'))return raw;return `img/${raw}.png`;}
function render(){const q=$('q').value.trim().toLowerCase(),cat=$('category').value,mode=new URLSearchParams(location.search).get('mode')||'';const list=products.filter(p=>(mode!=='multitrack'||/multitrack/i.test(String(p.type||'')))&&(!cat||p.category===cat)&&(!q||`${p.name} ${p.category} ${p.type} ${p.shortDescription}`.toLowerCase().includes(q)));$('grid').innerHTML=list.length?list.map(p=>`<a class="card" href="producto.html?slug=${encodeURIComponent(p.slug)}">${p.badge?`<span class="badge">${esc(p.badge)}</span>`:''}${!p.deliveryConfigured?'<span class="blocked">Configurando entrega</span>':''}<div class="visual"><img src="${esc(imageOf(p))}" onerror="this.src='img/dingloft.png'" alt=""></div><div class="copy"><div class="meta">${esc(p.category||p.type)}</div><div class="title">${esc(p.name)}</div><div class="desc">${esc(p.shortDescription||p.type||'Producto digital Dingloft')}</div><div class="bottom"><div><span class="price">${Number(p.priceUsd)===0?'Gratis':`$${Number(p.priceUsd).toFixed(2)}`}</span>${Number(p.compareAtUsd)>Number(p.priceUsd)?`<span class="old">$${Number(p.compareAtUsd).toFixed(2)}</span>`:''}</div><span class="go"><i class="bi bi-arrow-up-right"></i></span></div></div></a>`).join(''):'<div class="empty">No encontramos productos con ese filtro.</div>';}
(async()=>{try{const r=await fetch(WORKER+'/products/public',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'No se pudo cargar');products=d.products||[];const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');render();}catch(e){$('grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}})();$('q').oninput=render;$('category').onchange=render;
</script>
<script>
(()=>{if(new URLSearchParams(location.search).get('mode')==='multitrack'){document.title='Multitracks · Dingloft';const h=document.querySelector('h1');if(h)h.textContent='Multitracks.';const p=document.querySelector('header p, main>p');if(p)p.textContent='Pistas digitales por canales disponibles desde tu cuenta Dingloft.';}})();
</script>
</body></html>
