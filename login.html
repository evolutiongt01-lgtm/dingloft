<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Dingloft</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #05070a;
      --accent-color: #00e5ff;
      --accent-hover: #00b5cc;
      --text-main: #ffffff;
      --text-muted: #d1d5db;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(17, 21, 31, 0.5);
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Animación de orbes de luz idéntica a la tienda */
    @keyframes orbFloat1 {
      0% { transform: translate(0px, 0px) scale(1); background: #00e5ff; }
      33% { transform: translate(150px, 200px) scale(1.2); background: #a200ff; }
      66% { transform: translate(-100px, 150px) scale(0.9); background: #00ff88; }
      100% { transform: translate(0px, 0px) scale(1); background: #00e5ff; }
    }

    @keyframes orbFloat2 {
      0% { transform: translate(0px, 0px) scale(1); background: #a200ff; }
      33% { transform: translate(-200px, -150px) scale(1.3); background: #00ff88; }
      66% { transform: translate(150px, -100px) scale(0.8); background: #00e5ff; }
      100% { transform: translate(0px, 0px) scale(1); background: #a200ff; }
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      opacity: 0.35;
      pointer-events: none;
    }
    .orb-1 { width: 450px; height: 450px; top: -100px; left: -100px; animation: orbFloat1 18s infinite alternate ease-in-out; }
    .orb-2 { width: 550px; height: 550px; bottom: -150px; right: -150px; animation: orbFloat2 22s infinite alternate ease-in-out; }

    .glass-effect {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    /* Navbar */
    .navbar-glass {
      background: rgba(5, 7, 10, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 0;
    }

    /* Contenedor del Login */
    .login-container {
      max-width: 440px;
      width: 100%;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px 15px;
      border-radius: 8px;
    }
    .form-control:focus {
      background: rgba(0, 0, 0, 0.5);
      border-color: var(--accent-color);
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }
    .form-label { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }

    .btn-cyan {
      background: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }
    .btn-cyan:hover { background: var(--accent-hover); color: #000; transform: translateY(-2px); box-shadow: 0 5px 25px rgba(0, 229, 255, 0.5); }

    .text-accent { color: var(--accent-color); }
  </style>
</head>
<body>

  <!-- Orbes de luz dinámicos -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-glass">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 text-white" href="index.html">
        <span class="text-accent">D</span>ingloft
      </a>
      <a href="index.html" class="btn btn-outline-custom text-white btn-sm" style="border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 15px;">
        <i class="bi bi-arrow-left"></i> Volver a la tienda
      </a>
    </div>
  </nav>

  <!-- Sección de Inicio de Sesión -->
  <div class="container my-5">
    <div class="login-container glass-effect">
      <div class="text-center mb-4">
        <h3 class="fw-bold mb-2">Bienvenido de nuevo</h3>
        <p class="text-muted small">Ingresa a tu cuenta para gestionar tus licencias vitalicias</p>
      </div>

      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0" id="email" placeholder="tucorreo@dominio.com" required>
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center">
            <label for="password" class="form-label">Contraseña</label>
            <a href="#" class="text-accent small text-decoration-none">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0" style="border-color: var(--border-color); color: var(--text-muted);"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-cyan w-100 mb-3">Iniciar Sesión</button>
        
        <div class="text-center">
          <p class="text-muted small mb-0">¿Aún no tienes cuenta? <a href="#" class="text-accent text-decoration-none fw-semibold">Regístrate aquí</a></p>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-4 border-top" style="border-color: var(--border-color) !important;">
    <div class="container text-center">
      <p class="mb-0 text-white font-weight-bold" style="font-size: 0.9rem;">
        &copy; 2026 Dingloft - Evolution Group. Todos los derechos reservados.
      </p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
