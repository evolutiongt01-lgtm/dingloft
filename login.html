<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Iniciar sesión | Dingloft</title>
<meta name="theme-color" content="#f6f6f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#f6f6f1;
  --paper:#ffffff;
  --paper-2:#fbfbf7;
  --ink:#0d1114;
  --muted:#6f7680;
  --line:#d8dbd2;
  --line-soft:#e7e8e1;
  --lime:#b7ff34;
  --danger:#b42318;
  --ok:#176b3a;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0%, rgba(183,255,52,.10), transparent 16%), linear-gradient(180deg,#f8f8f4 0%,#f2f2ec 100%);color:var(--ink)}
html{overflow-x:hidden}body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.page{min-height:100dvh;display:grid;align-items:center;padding:16px 22px 18px;overflow:hidden}
.shell{width:min(940px,100%);margin:0 auto;display:grid;gap:16px;align-content:center;max-height:calc(100dvh - 34px)}
.login-card{position:relative;width:min(560px,100%);margin:0 auto;padding:28px 30px 22px;border-radius:30px;background:linear-gradient(180deg,var(--paper) 0%,var(--paper-2) 100%);border:1px solid rgba(12,15,17,.08);box-shadow:0 24px 70px rgba(10,12,15,.08),0 8px 20px rgba(10,12,15,.04);animation:fadeRise .72s cubic-bezier(.2,.8,.2,1) both}
.login-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:30px 30px 0 0;background:linear-gradient(90deg,var(--lime),rgba(183,255,52,.18),transparent 72%)}
.login-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at top center, rgba(183,255,52,.09), transparent 42%);opacity:.7;animation:softGlow 8s ease-in-out infinite}
.logo-lockup{position:relative;display:grid;justify-items:center;margin-bottom:18px;z-index:1}
.logo-lockup img{width:78px;height:78px;object-fit:contain;filter:grayscale(1) contrast(1.25);animation:logoFloat 5.6s ease-in-out infinite}
.kicker{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:31px;padding:0 14px;margin-top:8px;border-radius:999px;background:#efefe9;border:1px solid rgba(13,15,17,.06);color:#666d74;font-size:.63rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(183,255,52,.12)}
.logo-lockup h1{margin:14px 0 0;text-align:center;font-size:clamp(2.2rem,2.8vw,3.1rem);line-height:.95;letter-spacing:-.075em;font-weight:900}
.logo-lockup p{margin:10px auto 0;max-width:400px;text-align:center;color:var(--muted);font-size:.92rem;line-height:1.56}
.status{display:none;margin:14px 0 0;padding:13px 14px;border-radius:14px;font-size:.88rem;font-weight:600;line-height:1.5;position:relative;z-index:1}.status.show{display:block}.status.error{background:#fff1f1;color:var(--danger);border:1px solid #ffd4d1}.status.ok{background:#effbf2;color:var(--ok);border:1px solid #cfead6}
#loginForm{position:relative;z-index:1;margin-top:22px;display:grid;gap:10px}
.field-label{display:flex;align-items:center;justify-content:space-between;gap:12px}.field-label label{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6c7279}.field-label button{padding:0;border:0;background:none;color:#5f666d;font-size:.77rem;font-weight:700;transition:opacity .2s ease}.field-label button:hover{opacity:.72}
.field{position:relative;display:flex;align-items:center;min-height:54px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.9);transition:border-color .18s ease,box-shadow .18s ease,background .18s ease,transform .18s ease}
.field:hover{transform:translateY(-1px)}
.field:focus-within{border-color:#a4c45a;background:#fff;box-shadow:0 0 0 4px rgba(183,255,52,.14)}
.field>i{margin-left:16px;color:#7a8188;font-size:.92rem}.field input{flex:1;min-width:0;height:52px;border:0;background:transparent;padding:0 14px 0 10px;color:#121518;font-size:.94rem;outline:none}.field input::placeholder{color:#979da4}.eye{width:40px;height:40px;margin-right:8px;border:0;border-radius:10px;background:transparent;color:#777e85;transition:background .18s ease,color .18s ease}.eye:hover{background:#f0f1eb;color:#111417}
.options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px;color:#5f666d;font-size:.8rem}.options label{display:flex;align-items:center;gap:9px;cursor:pointer}.options input{accent-color:#0d1113;width:14px;height:14px}
.primary{position:relative;overflow:hidden;height:54px;border:0;border-radius:14px;background:#0b1012;color:#fff;font-size:.94rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 32px rgba(11,16,18,.14);transition:transform .18s ease,box-shadow .18s ease}
.primary:hover{transform:translateY(-1px);box-shadow:0 18px 34px rgba(11,16,18,.18)}.primary:disabled{opacity:.65;cursor:not-allowed}
.primary::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:buttonSweep 4.8s ease-in-out infinite}
.divider{display:flex;align-items:center;gap:11px;margin:18px 0 12px;color:#8a8f95;font-size:.6rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;position:relative;z-index:1}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.social{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}.social button{height:46px;border:1px solid #d4d6cf;border-radius:12px;background:rgba(255,255,255,.82);color:#181b1e;font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.social button:hover{background:#fff;border-color:#bfc3ba;transform:translateY(-1px);box-shadow:0 10px 18px rgba(0,0,0,.04)}
.register{position:relative;z-index:1;margin:14px 0 0;text-align:center;color:#6b7179;font-size:.8rem}.register a{color:#111417;font-weight:800}
.secure-note{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);color:#80868d;font-size:.66rem;font-weight:700}
.account-strip{width:100%;padding:14px 18px;border-radius:22px;background:#0c1012;color:#fff;border:1px solid rgba(255,255,255,.04);box-shadow:0 18px 46px rgba(0,0,0,.14);animation:fadeRise .88s cubic-bezier(.2,.8,.2,1) .08s both}
.strip-label{margin:0 0 10px;color:#9ea5ad;font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.strip-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.strip-item{min-width:0;padding:14px 12px;background:rgba(255,255,255,.03);display:flex;align-items:center;gap:10px;justify-content:center;text-align:center;transition:transform .18s ease,background .18s ease}
.strip-item:hover{transform:translateY(-1px);background:rgba(255,255,255,.06)}
.strip-item i{font-size:.98rem;color:#fff;opacity:.94;flex:0 0 auto}
.strip-item span{font-size:.84rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes fadeRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes softGlow{0%,100%{opacity:.52}50%{opacity:.82}}
@keyframes buttonSweep{0%,55%,100%{left:-35%}72%{left:112%}}
@media(max-width:900px){
  .page{padding:22px 18px calc(22px + var(--safe-bottom));overflow:visible}
  .shell{gap:14px;max-height:none}
  .login-card{padding:24px 20px 20px;border-radius:24px}
  .login-card::before{border-radius:24px 24px 0 0}
  .logo-lockup img{width:70px;height:70px}
  .logo-lockup h1{font-size:2.3rem}
  .logo-lockup p{font-size:.9rem}
  .social{grid-template-columns:1fr}
  .account-strip{padding:12px 12px 10px;border-radius:18px}
  .strip-label{text-align:left;margin-bottom:9px}
  .strip-row{display:flex;gap:10px;background:none;overflow:auto;padding-bottom:3px;scrollbar-width:none}
  .strip-row::-webkit-scrollbar{display:none}
  .strip-item{min-width:max-content;padding:13px 15px;border-radius:13px;background:rgba(255,255,255,.05)}
}
@media(max-width:560px){
  .page{padding:18px 14px calc(18px + var(--safe-bottom))}
  .login-card{padding:22px 16px 18px}
  .logo-lockup img{width:62px;height:62px}
  .logo-lockup h1{font-size:2.05rem}
  .field{min-height:52px}.field input{height:50px}.primary{height:52px}
  .secure-note{font-size:.62rem;text-align:center}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
html.dingloft-shell-view body{background:#fff!important}
html.dingloft-shell-view .page{min-height:auto!important;padding:18px!important;overflow:visible!important}
html.dingloft-shell-view .shell{max-height:none!important}
</style>
</head>
<body class="dingloft-helmet-page dl-page-login">
<main class="page">
  <div class="shell">
    <section class="login-card">
      <div class="logo-lockup">
        <img src="img/logoactual.png" alt="Dingloft">
        <div class="kicker">Acceso seguro</div>
        <h1>Iniciar sesión</h1>
        <p>Entra con la cuenta vinculada a tus compras para continuar a tu biblioteca.</p>
      </div>

      <div class="status" id="status" role="status"></div>

      <form id="loginForm" novalidate>
        <div class="field-label"><label for="email">Correo electrónico</label></div>
        <div class="field"><i class="bi bi-envelope"></i><input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required></div>

        <div class="field-label"><label for="password">Contraseña</label><button id="forgotBtn" type="button">¿La olvidaste?</button></div>
        <div class="field"><i class="bi bi-lock"></i><input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required><button class="eye" id="eyeBtn" type="button" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button></div>

        <div class="options"><label><input id="remember" type="checkbox" checked> Mantener mi sesión iniciada</label></div>
        <button class="primary" id="loginBtn" type="submit">Iniciar sesión <i class="bi bi-arrow-right"></i></button>
      </form>

      <div class="divider">o continúa con</div>
      <div class="social">
        <button type="button" id="googleBtn"><i class="bi bi-google"></i> Google</button>
        <button type="button" id="facebookBtn"><i class="bi bi-facebook"></i> Facebook</button>
      </div>

      <p class="register">¿No tienes cuenta? <a href="register.html">Crear cuenta</a></p>
      <div class="secure-note"><i class="bi bi-lock"></i> Tus credenciales se procesan de forma segura.</div>
    </section>

    <section class="account-strip" aria-label="Dentro de tu cuenta">
      <p class="strip-label">Dentro de tu cuenta</p>
      <div class="strip-row">
        <article class="strip-item"><i class="bi bi-grid"></i><span>Biblioteca</span></article>
        <article class="strip-item"><i class="bi bi-shield-check"></i><span>Licencias</span></article>
        <article class="strip-item"><i class="bi bi-receipt"></i><span>Comprobantes</span></article>
        <article class="strip-item"><i class="bi bi-cloud-arrow-down"></i><span>Descargas</span></article>
        <article class="strip-item"><i class="bi bi-headset"></i><span>Soporte</span></article>
        <article class="strip-item"><i class="bi bi-calendar-check"></i><span>Reservas</span></article>
      </div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAKxQdUM49cVbBaXWJ5DF3s7EaNKlJRGhA",authDomain:"login-dingloft.firebaseapp.com",projectId:"login-dingloft",storageBucket:"login-dingloft.firebasestorage.app",messagingSenderId:"549466738202",appId:"1:549466738202:web:8bf305fe2c753e9d76cba3",measurementId:"G-R9SGZCDN13"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const COMMERCE_WORKER='https://autumn-breeze-dfa0.evolutiongt01.workers.dev';
const status=document.getElementById('status'), loginBtn=document.getElementById('loginBtn');
const params=new URLSearchParams(location.search);
const safeNext=()=>{const raw=params.get('next')||'account.html';try{const u=new URL(raw,location.href);if(u.origin!==location.origin)return'account.html';const f=u.pathname.split('/').filter(Boolean).pop()||'account.html';if(!/^[A-Za-z0-9_.-]+\.html$/i.test(f))return'account.html';return `${f}${u.search}${u.hash}`}catch(_){return'account.html'}};
const show=(msg,type='error')=>{status.textContent=msg;status.className=`status show ${type}`};
const friendly=e=>({
  'auth/invalid-credential':'El correo o la contraseña no coinciden.',
  'auth/invalid-email':'Escribe un correo válido.',
  'auth/too-many-requests':'Hubo demasiados intentos. Espera un momento e inténtalo otra vez.',
  'auth/popup-closed-by-user':'Cerraste la ventana antes de terminar el inicio de sesión.',
  'auth/network-request-failed':'No pudimos conectarnos. Revisa tu internet.'
}[e?.code]||'No pudimos iniciar sesión. Revisa tus datos e inténtalo nuevamente.');
async function saveUser(user){try{await setDoc(doc(db,'users',user.uid),{uid:user.uid,email:user.email||'',displayName:user.displayName||'Usuario Dingloft',photoURL:user.photoURL||'',lastLogin:serverTimestamp()},{merge:true})}catch(e){console.warn('profile sync',e)}}
async function sendWelcomeMail(user){try{const token=await user.getIdToken();const response=await fetch(`${COMMERCE_WORKER}/auth/login-welcome`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'content-type':'application/json'},body:'{}'});if(!response.ok)console.warn('welcome mail',await response.text().catch(()=>''))}catch(error){console.warn('welcome mail',error)}}
async function finish(user,{welcome=false}={}){await saveUser(user);if(welcome){show('Sesión iniciada. Preparando tu cuenta…','ok');await sendWelcomeMail(user)}location.replace(safeNext())}
let initial=true;
onAuthStateChanged(auth,user=>{if(initial){initial=false;if(user)finish(user,{welcome:false})}});
document.getElementById('eyeBtn').addEventListener('click',()=>{const p=document.getElementById('password'),i=document.querySelector('#eyeBtn i'),showing=p.type==='text';p.type=showing?'password':'text';i.className=showing?'bi bi-eye':'bi bi-eye-slash'});
document.getElementById('forgotBtn').addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email)return show('Escribe primero tu correo y luego toca “¿La olvidaste?”.');try{await sendPasswordResetEmail(auth,email);show('Te enviamos un correo para restablecer tu contraseña.','ok')}catch(e){show(friendly(e))}});
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return show('Completa tu correo y contraseña.');loginBtn.disabled=true;loginBtn.innerHTML='<i class="bi bi-arrow-repeat"></i> Verificando…';try{await setPersistence(auth,document.getElementById('remember').checked?browserLocalPersistence:browserSessionPersistence);const r=await signInWithEmailAndPassword(auth,email,password);await finish(r.user,{welcome:true})}catch(err){show(friendly(err));loginBtn.disabled=false;loginBtn.innerHTML='Iniciar sesión <i class="bi bi-arrow-right"></i>'}});
document.getElementById('googleBtn').addEventListener('click',async()=>{try{await setPersistence(auth,browserLocalPersistence);const r=await signInWithPopup(auth,new GoogleAuthProvider());await finish(r.user,{welcome:true})}catch(e){show(friendly(e))}});
document.getElementById('facebookBtn').addEventListener('click',async()=>{try{await setPersistence(auth,browserLocalPersistence);const r=await signInWithPopup(auth,new FacebookAuthProvider());await finish(r.user,{welcome:true})}catch(e){show(friendly(e))}});
if(params.get('loggedout')==='1')show('La sesión se cerró correctamente.','ok');
</script>
<script src="mobile-shell-redirect.js?v=14"></script>
<script src="dingloft-ui-guard.js?v=58"></script>
</body>
